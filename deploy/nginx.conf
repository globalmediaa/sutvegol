# Existing HOST Nginx. Docker binds only 127.0.0.1:12883.
# Enable this HTTP server, then let the existing Certbot workflow add TLS.
server {
    listen 80;
    listen [::]:80;
    server_name sutvegol.gmgaming.app;
    client_max_body_size 256k;
    location / {
        proxy_pass http://127.0.0.1:12883;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location ~ /(?:\.env|\.git|composer\.(?:json|lock)) { deny all; }
}
